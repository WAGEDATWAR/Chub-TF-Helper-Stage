name: Deploy Chrysalis Helper Stage

on:
  push:
    branches: [main, master]
    paths: ['**']
    tags: ['stage-v*']
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    env:
      # Cloudflare on api.chub.ai rejects the default curl UA with a geo 403
      # ("not available in your country"); a browser UA gets through.
      UA: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '21.7.1'

      - name: Check the auth token is present
        env:
          CHUB_AUTH_TOKEN: ${{ secrets.CHUB_AUTH_TOKEN }}
        run: |
          if [ -z "${{ secrets.CHUB_AUTH_TOKEN }}" ] || [ "${{ secrets.CHUB_AUTH_TOKEN }}" == "null" ]; then
            echo "Set the CHUB_AUTH_TOKEN repo secret first."; exit 1
          fi

      - name: Get or create the stage id
        env:
          CHUB_AUTH_TOKEN: ${{ secrets.CHUB_AUTH_TOKEN }}
          STAGE_ID: ${{ secrets.STAGE_ID }}
        run: |
          touch public/chub_meta.yaml
          if ! grep -q "^github_path:" public/chub_meta.yaml; then
            echo -e "\ngithub_path: 'https://github.com/${{ github.repository }}'\n" >> public/chub_meta.yaml
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add public/chub_meta.yaml && git commit -m "Add github_path" || true
            git push || true
          fi
          if [ -z "${{ secrets.STAGE_ID }}" ]; then
            STAGE_ID=$(grep '^extension_id:' public/chub_meta.yaml | cut -d ':' -f2 | tr -d " '\"")
            if [ -z "${STAGE_ID}" ]; then
              sudo apt-get install -y jq
              echo "Creating the stage..."
              code=$(curl -s -w '%{http_code}' -A "$UA" -H "CH-API-KEY: ${{ secrets.CHUB_AUTH_TOKEN }}" -H "Content-Type: application/json" \
                --request POST --data "{\"name\":\"${{ github.event.repository.name }}-stage\"}" \
                https://api.chub.ai/extensions -o creation.json)
              echo "HTTP $code"
              cat creation.json; echo
              STAGE_ID=$(jq -r '.id_v2 // .id // .extension_id // empty' creation.json)
              if [ -z "${STAGE_ID}" ] || [ "${STAGE_ID}" == "null" ]; then
                echo "Stage creation failed (HTTP $code)."
                exit 1
              fi
              echo -e "\nextension_id: '${STAGE_ID}'\n" >> public/chub_meta.yaml
              git config --local user.email "action@github.com"
              git config --local user.name "GitHub Action"
              git add public/chub_meta.yaml && git commit -m "Add extension id" || true
              git push || true
            fi
          else
            STAGE_ID=${{ secrets.STAGE_ID }}
          fi
          echo "STAGE_ID=${STAGE_ID}" >> $GITHUB_ENV

      - name: Install
        run: npm ci || npm install

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Zip
        run: cd dist && zip -r ../build.zip * && cd ..

      - name: Upload
        env:
          CHUB_AUTH_TOKEN: ${{ secrets.CHUB_AUTH_TOKEN }}
        run: |
          curl -A "$UA" -H "CH-API-KEY: ${{ secrets.CHUB_AUTH_TOKEN }}" \
            -F "file=@build.zip" \
            https://api.chub.ai/extension/${{ env.STAGE_ID }}/upload
